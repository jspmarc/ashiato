name: CI

# Two jobs, one per test adapter, each deliberately ordered: the migration
# chain must apply *and reverse* before the test suite means anything.
#
# The SQLite job needs no service container. The PostgreSQL job runs against a
# postgres:17 service and sets ASHIATO_TEST_ADAPTER so the suite compiles the
# Postgres adapter; its cache key is adapter-specific so neither job can
# restore the other's build.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # Pinned to what the code was verified against. mix.exs allows ~> 1.17,
          # so bumping these is safe as long as the lockfile still resolves.
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Migrations apply from empty
        run: |
          mix ecto.create
          mix ecto.migrate

      # A migration that cannot roll back cannot be deployed safely. This also
      # proves every migration is `change/0`-reversible or has an explicit
      # `down/0`.
      - name: Migrations reverse and re-apply
        run: |
          mix ecto.rollback --all
          mix ecto.migrate

      # Includes the schema<->database agreement test: every schema field must
      # exist as a column. `mix test` also runs ecto.setup's quiet create and
      # migrate via the alias in mix.exs.
      - name: Tests
        run: mix test

  test-postgres:
    name: Migrations and tests (PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ashiato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      ASHIATO_TEST_ADAPTER: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ashiato_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # Pinned to what the code was verified against. mix.exs allows ~> 1.17,
          # so bumping these is safe as long as the lockfile still resolves.
          otp-version: "27"
          elixir-version: "1.18"

      # Adapter-specific key: a build compiled against SQLite must never be
      # restored here, because the adapter is baked in at compile time.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-pg-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-pg-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Migrations apply from empty
        run: |
          mix ecto.create
          mix ecto.migrate

      # A migration that cannot roll back cannot be deployed safely. This also
      # proves every migration is `change/0`-reversible or has an explicit
      # `down/0`.
      - name: Migrations reverse and re-apply
        run: |
          mix ecto.rollback --all
          mix ecto.migrate

      # Includes the schema<->database agreement test: every schema field must
      # exist as a column. `mix test` also runs ecto.setup's quiet create and
      # migrate via the alias in mix.exs.
      - name: Tests
        run: mix test
